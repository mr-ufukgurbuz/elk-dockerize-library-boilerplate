name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build & unit tests (Java 11)
        run: mvn -B verify
      - name: Build without Maven (offline path)
        run: ./libs/build-without-maven.sh /tmp/out && ls -l /tmp/out

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Compose file is valid
        working-directory: elk-stack
        run: cp .env.example .env && docker compose config -q
      - name: Saved objects are up to date
        run: |
          python3 elk-stack/setup/kibana/generate-saved-objects.py > /tmp/so.ndjson
          diff -u elk-stack/setup/kibana/applogs-saved-objects.ndjson /tmp/so.ndjson

  e2e:
    runs-on: ubuntu-latest
    needs: [java, scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: sudo sysctl -w vm.max_map_count=262144
      - name: End-to-end (ELK + sample apps)
        run: tests/e2e.sh --down
