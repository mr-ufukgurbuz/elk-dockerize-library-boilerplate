server.name: elk-kibana
server.host: "0.0.0.0"
server.publicBaseUrl: "${KIBANA_PUBLIC_URL}"

elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: kibana_system
elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"

# Alerting, rapor vb. icin gerekli sifreleme anahtarlari
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.reporting.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"

# Stack Monitoring arayuzu
monitoring.ui.enabled: true
monitoring.ui.container.elasticsearch.enabled: true
monitoring.kibana.collection.enabled: true

# OFFLINE ORTAM: internete cikmaya calisan ozellikleri kapat
telemetry.enabled: false
telemetry.optIn: false
newsfeed.enabled: false
xpack.fleet.agents.enabled: false
map.includeElasticMapsService: false

i18n.locale: "en"
