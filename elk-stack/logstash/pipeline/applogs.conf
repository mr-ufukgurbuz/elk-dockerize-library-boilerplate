# =====================================================================
#  applogs pipeline
#  elk-logger kutuphanesinden gelen olaylari alir, proje adina gore
#  ayri index'lere yazar:   applogs-<project>-YYYY.MM.dd
#
#  Olay semasi (sozlesme): docs/ai/EVENT-SCHEMA.md
# =====================================================================

input {
  # Varsayilan transport: her satir bir JSON olay (elk.transport=tcp)
  tcp {
    id    => "in_tcp"
    port  => 5000
    codec => json_lines { decode_size_limit_bytes => 10485760 }
    add_field => { "transport" => "tcp" }
  }

  # Alternatif transport: POST edilen JSON dizi (elk.transport=http)
  # Basic auth istenirse: user => "..." password => "..." ekleyin ve
  # kutuphanede elk.logstash.http.username/password verin.
  http {
    id    => "in_http"
    port  => 8080
    codec => json
    additional_codecs => { "application/json" => "json" }
    remote_host_target_field => "[@metadata][remote_host]"
    request_headers_target_field => "[@metadata][headers]"
    add_field => { "transport" => "http" }
  }
}

filter {
  # TCP input'un ekledigi baglanti bilgisi (gonderenin IP'si) -> client_ip
  # (kutuphane makine adini 'hostname' alaninda gonderir, 'host' kullanmaz)
  if [host] {
    mutate { rename => { "host" => "client_ip" } }
  }
  if [@metadata][remote_host] {
    mutate { add_field => { "client_ip" => "%{[@metadata][remote_host]}" } }
  }
  mutate { remove_field => ["port", "@version"] }

  # JSON parse edilemeyen satirlar
  if "_jsonparsefailure" in [tags] {
    mutate { replace => { "project" => "invalid" } add_field => { "level" => "WARN" } }
  }

  # Proje adi = index adi parcasi. Kutuphaneyle ayni sanitize kurali.
  if ![project] or [project] == "" {
    mutate { add_field => { "project" => "unknown" } }
  }
  mutate { lowercase => ["project"] }
  mutate { gsub => ["project", "[^a-z0-9_-]", "-"] }

  if ![level] {
    mutate { add_field => { "level" => "INFO" } }
  }
  mutate { uppercase => ["level"] }

  # Index adinin olusturulmasi icin metadata (dokumana yazilmaz)
  mutate { add_field => { "[@metadata][index]" => "applogs-%{[project]}" } }
}

output {
  elasticsearch {
    id          => "out_es"
    hosts       => ["http://elasticsearch:9200"]
    user        => "logstash_writer"
    password    => "${LOGSTASH_WRITER_PASSWORD}"
    index       => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    data_stream => "false"
    manage_template => false
    ilm_enabled => false
    action      => "create"
  }
}
