# =====================================================================
#  Offline ELK ortami (tek sunucu, tek node).
#  Baslatma:  ./bin/elk.sh up        (veya: docker compose up -d)
#
#  Servisler:
#    elasticsearch  : loglarin saklandigi arama motoru          (port ES_PORT)
#    setup          : tek seferlik; kullanici/rol/ILM/template olusturur, sonra cikar
#    logstash       : uygulamalardan log alir (TCP 5000, HTTP 8080), ES'ye yazar
#    kibana         : web arayuzu                                (port KIBANA_PORT)
#    kibana-setup   : tek seferlik; data view + dashboard import eder, sonra cikar
#
#  Imajlar internetten CEKILMEZ; offline paketteki tar dosyasindan
#  'docker load' ile yuklenir (pull_policy: never).
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-elk}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  elasticsearch:
    image: elasticsearch:${ELK_VERSION}
    pull_policy: never
    container_name: elk-elasticsearch
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms${ES_HEAP} -Xmx${ES_HEAP}
    volumes:
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,z
      - es-data:/usr/share/elasticsearch/data
      - es-snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ES_PORT:-9200}:9200"
    networks: [elk]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  setup:
    image: elasticsearch:${ELK_VERSION}
    pull_policy: never
    container_name: elk-setup
    restart: "no"
    command: ["bash", "/setup/setup-elasticsearch.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      LOGSTASH_SYSTEM_PASSWORD: ${LOGSTASH_SYSTEM_PASSWORD}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./setup:/setup:ro,z
    networks: [elk]
    logging: *default-logging
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: logstash:${ELK_VERSION}
    pull_policy: never
    container_name: elk-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms${LS_HEAP} -Xmx${LS_HEAP}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD}
      LOGSTASH_SYSTEM_PASSWORD: ${LOGSTASH_SYSTEM_PASSWORD}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,z
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro,z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,z
      - ls-data:/usr/share/logstash/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${LOGSTASH_TCP_PORT:-5000}:5000/tcp"
      - "${BIND_ADDRESS:-0.0.0.0}:${LOGSTASH_HTTP_PORT:-8080}:8080/tcp"
      - "${BIND_ADDRESS:-0.0.0.0}:${LOGSTASH_API_PORT:-9600}:9600/tcp"
    networks: [elk]
    logging: *default-logging
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/pipelines/applogs | grep -q applogs"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  kibana:
    image: kibana:${ELK_VERSION}
    pull_policy: never
    container_name: elk-kibana
    restart: unless-stopped
    environment:
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY}
      KIBANA_PUBLIC_URL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,z
      - kibana-data:/usr/share/kibana/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${KIBANA_PORT:-5601}:5601"
    networks: [elk]
    logging: *default-logging
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u kibana_system:$${KIBANA_SYSTEM_PASSWORD} http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 60s

  kibana-setup:
    image: elasticsearch:${ELK_VERSION}
    pull_policy: never
    container_name: elk-kibana-setup
    restart: "no"
    command: ["bash", "/setup/setup-kibana.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./setup:/setup:ro,z
    networks: [elk]
    logging: *default-logging
    depends_on:
      kibana:
        condition: service_healthy

networks:
  elk:
    name: elk
    driver: bridge

volumes:
  es-data:
  es-snapshots:
  ls-data:
  kibana-data:
