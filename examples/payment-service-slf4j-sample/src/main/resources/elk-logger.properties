# Ornek Proje B - payment-service (SLF4J API ile)
# Loglama alani: applogs-payment-service-YYYY.MM.dd  (Proje A'dan tamamen ayri)
elk.project.name=payment-service
elk.application.name=Payment Service
elk.environment=${APP_ENV:dev}

# Bu proje HTTP transport kullanir (her batch icin Logstash onayi alinir)
elk.transport=http
elk.logstash.host=${ELK_HOST:localhost}
elk.logstash.http.port=8080

elk.level=DEBUG
elk.console.enabled=true
elk.console.level=INFO
elk.labels.team=odeme-ekibi
