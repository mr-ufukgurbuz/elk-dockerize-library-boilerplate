# Ornek Proje D - billing-batch (Maven/Gradle YOK, duz Java)
# Bu dosya su yollardan biriyle bulunur (run.sh modlarina bakin):
#   - config/ dizini classpath'e eklenirse           (java -cp "...:config")
#   - calisma dizininde config/elk-logger.properties  (kutuphane otomatik arar)
#   - -Delk.config.file=config/elk-logger.properties
# Loglama alani: applogs-billing-batch-YYYY.MM.dd
elk.project.name=billing-batch
elk.application.name=Billing Batch
elk.environment=${APP_ENV:dev}

elk.transport=tcp
elk.logstash.host=${ELK_HOST:localhost}
elk.logstash.tcp.port=5000

elk.level=INFO
elk.console.enabled=true
elk.fallback.file.enabled=true
elk.fallback.file.path=logs/billing-batch-elk-fallback.log
elk.labels.team=finans-ekibi
