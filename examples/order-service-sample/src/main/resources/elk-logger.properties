# =====================================================================
#  Ornek Proje A - order-service
#  Bu dosya classpath'te (src/main/resources) oldugu icin otomatik okunur.
#  Calisma aninda -Delk.config.file=/etc/myapp/elk-logger.properties ile
#  disaridan baska bir dosya verilebilir; tek tek degerler ELK_* ortam
#  degiskenleri veya -Delk.* system property'leri ile ezilebilir.
#  Tum anahtarlar: docs/07-KONFIGURASYON-REFERANSI.md
# =====================================================================

# Loglama alani: Elasticsearch index'i applogs-order-service-YYYY.MM.dd olur
elk.project.name=order-service
elk.application.name=Order Service
elk.environment=${APP_ENV:dev}

# ELK ortami baglantisi (ortami kurdugunuz sunucunun adresi)
elk.transport=tcp
elk.logstash.host=${ELK_HOST:localhost}
elk.logstash.tcp.port=5000

# Seviyeler
elk.level=INFO
elk.level.com.example.orders.repository=DEBUG

# Konsola da yaz (gelistirme icin faydali)
elk.console.enabled=true

# ELK'ya ulasilamazsa kaybolmasin
elk.fallback.file.enabled=true
elk.fallback.file.path=logs/order-service-elk-fallback.log

# Her loga eklenecek sabit etiketler
elk.labels.team=siparis-ekibi
elk.labels.region=istanbul

# Hangi sinif/metot/satir logladi bilgisi (biraz maliyetli)
elk.include.caller=true
